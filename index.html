<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zem Zem Bio Produkt</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body{
  font-family:Inter;
  background:#050705;
  color:#e5e5e5;
  overflow-x:hidden;
}

.glass{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}

.btn{
  background:linear-gradient(135deg,#8fbf9f,#a8d5b5);
  color:black;
  transition:0.3s;
}
.btn:hover{
  transform:scale(1.05);
}

.float{
  animation:float 5s ease-in-out infinite;
}
@keyframes float{
  50%{transform:translateY(-15px);}
}

.fade{
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}
.fade.show{
  opacity:1;
  transform:translateY(0);
}

/* FIX IMAGES */
.side-img{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:5;
}
.left-img{ left:0; }
.right-img{ right:0; }

/* MOBILE FIX */
@media (max-width:768px){
  .side-img{
    display:none; /* hide on mobile = clean layout */
  }
}
</style>
</head>

<body>

<div class="bg-overlay"></div>

<!-- NAV -->
<header class="fixed w-full z-50 glass">
  <div class="max-w-7xl mx-auto flex justify-between items-center px-4 py-3">

    <img src="logo2.png" class="w-12 md:w-16 float" style="border-radius: 100%;">

    <h1 class="text-lg md:text-2xl text-center flex-1">
      Zem Zem Bio Produkt
    </h1>

    <div class="w-12"></div> <!-- spacing fix -->
  </div>
</header>

<!-- HERO -->
<section class="relative min-h-screen flex items-center justify-center text-center px-4">

  <!-- LEFT -->
  <div class="side-img left-img">
    <img src="milk.png" class="w-40 md:w-[400px]">
  </div>

  <!-- RIGHT -->
  <div class="side-img right-img">
    <img src="dates.png" class="w-40 md:w-[400px]">
  </div>

  <!-- CENTER -->
  <div class="relative z-10 fade">
    <img src="logo2.png" class="w-28 md:w-40 mx-auto mb-6 float">

    <h1 class="text-3xl md:text-6xl mb-6">
      Zem Zem Bio Produkt
    </h1>

    <p class="text-gray-300 mb-8 text-sm md:text-base">
      Natyrë me besim. Bukuri me etikë.
    </p>

    <a href="produktet.html" class="btn px-6 md:px-10 py-3 md:py-4 rounded-full">
      Blej Tani
    </a>
  </div>

</section>

<!-- PARALLAX -->
<section class="py-20 md:py-32 text-center relative overflow-hidden">

  <div class="absolute inset-0 bg-cover bg-center"
       style="background-image:url('background.jpg');"></div>

  <div class="absolute inset-0 bg-black/60"></div>

  <div class="relative z-10 fade px-4">
    <h2 class="text-3xl md:text-5xl mb-6">Cilësi që ndjehet</h2>
    <p class="max-w-xl mx-auto text-gray-300 text-sm md:text-base">
      Çdo produkt është zgjedhur me kujdes për të ofruar përvojë premium dhe natyrale.
    </p>
  </div>

</section>

<!-- CTA -->
<section class="py-20 md:py-32 text-center fade px-4">
  <h2 class="text-3xl md:text-5xl mb-6">Gati për të jetuar më mirë?</h2>
  <a href="produktet.html" class="btn px-8 md:px-12 py-4 rounded-full text-base md:text-lg">
    Porosit Tani
  </a>
</section>

<script>
const faders=document.querySelectorAll(".fade");

window.addEventListener("scroll",()=>{
  faders.forEach(el=>{
    if(el.getBoundingClientRect().top<window.innerHeight-100){
      el.classList.add("show");
    }
  });
});
</script>

</body>
</html>
