<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zem Zem Bio Produkt</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body{
  font-family:Inter;
  background:#050705;
  color:#e5e5e5;
  scroll-behavior:smooth;
  overflow-x:hidden;
}

/* ===== GLASS EFFECT ===== */
.glass{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.08);
}

/* ===== BUTTON ===== */
.btn{
  background:linear-gradient(135deg,#8fbf9f,#a8d5b5);
  color:black;
  transition:0.4s;
}
.btn:hover{
  transform:scale(1.08);
  box-shadow:0 0 40px rgba(143,191,159,0.7);
}

/* ===== FLOAT ===== */
.float{
  animation:float 5s ease-in-out infinite;
}
@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-20px);}
  100%{transform:translateY(0);}
}

/* ===== FADE ===== */
.fade{
  opacity:0;
  transform:translateY(60px);
  transition:1s ease;
}
.fade.show{
  opacity:1;
  transform:translateY(0);
}

/* ===== HERO DECOR IMAGES ===== */
.left-img{
  position:absolute;
  top:25%;
  left:0;
  transform:translateY(-50%);
  z-index:5;
}
.right-img{
  position:absolute;
  top:25%;
  right:0;
  transform:translateY(-50%);
  z-index:5;
}

/* ===== BACKGROUND FIX ===== */
.bg-layer{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  z-index:-2;
}

.bg-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  z-index:-1;
}

/* =========================================================
   🔥 ONLY FIXES (NUK PREKIN STRUKTURËN TËNDE)
========================================================= */

/* prevent weird horizontal scroll on all devices */
html, body{
  max-width:100%;
  overflow-x:hidden;
}

/* make hero safe on small screens */
@media (max-width:1024px){

  .left-img img,
  .right-img img{
    width:220px !important;
    height:auto;
  }
}

/* tablet + mobile tuning */
@media (max-width:768px){

  #tit{
    font-size:22px !important;
    margin-right:0 !important;
    text-align:center;
  }

  .left-img img,
  .right-img img{
    width:140px !important;
  }

  .left-img{
    left:-10px;
    top:40%;
  }

  .right-img{
    right:-10px;
    top:40%;
  }

  .btn{
    padding:12px 24px;
  }
}

/* small phones */
@media (max-width:480px){

  /* keep layout clean */
  .left-img,
  .right-img{
    opacity:0.8;
  }

  h1{
    font-size:32px !important;
  }
}
</style>
</head>

<body>

<!-- NAV -->
<header class="fixed w-full z-50 glass">
  <div class="max-w-7xl mx-auto flex items-center justify-between p-3 md:p-4 flex-wrap gap-2">

    <img src="logo.png" class="h-10 md:h-14 w-auto">

    <h1 id="tit" class="text-center flex-1 text-lg md:text-2xl">
      Zem Zem Bio Produkt
    </h1>

    <div class="flex items-center gap-3">
      <button onclick="toggleCart()" class="text-xl">
        🛒 <span id="cart-count">0</span>
      </button>
    </div>

  </div>
</header>
<!-- HERO VIDEO SECTION -->
<section class="relative h-screen flex items-center justify-center text-center overflow-hidden">

  <!-- VIDEO BACKGROUND -->
  
<div class="bg-overlay"></div>

  <div class="absolute inset-0 bg-black/70"></div>

  <!-- LEFT IMAGE -->
  <div class="left-img fade-left">
    <img src="milk.png" class="w-80 md:w-[500px] object-contain">
  </div>

  <!-- RIGHT IMAGE -->
  <div class="right-img fade-right">
    <img src="dates.png" class="w-80 md:w-[500px] object-contain">
  </div>

  <!-- CENTER CONTENT -->
  <div class="relative z-10 fade">
    <img src="logo.png" class="w-40 mx-auto mb-6 float glow">
    <h1 class="text-6xl mb-6">Zem Zem Bio Produkt</h1>
    <p class="text-gray-300 mb-8">Natyrë me besim. Bukuri me etikë.</p>
    <a href="produktet .html" class="btn px-10 py-4 rounded-full">Blej Tani</a>
  </div>

</section>

<!-- PARALLAX SECTION -->
<section class="py-32 text-center relative overflow-hidden" id="parallax">
  <div id="bg" class="absolute inset-0 will-change-transform">
    <div class="absolute inset-0 bg-cover bg-center scale-110"
         style="background-image:url('background.jpg');"></div>
  </div>

  <canvas id="particles" class="absolute inset-0"></canvas>
  <div class="absolute inset-0 bg-black/60"></div>
  <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80"></div>
  <div id="glow" class="pointer-events-none absolute w-72 h-72 bg-green-300/20 blur-3xl rounded-full"></div>

  <div class="relative z-10 fade">
    <h2 class="text-5xl mb-6">Cilësi që ndjehet</h2>
    <p class="max-w-xl mx-auto text-gray-300">
      Çdo produkt është zgjedhur me kujdes për të ofruar përvojë premium dhe natyrale.
    </p>
  </div>
</section>

<!-- PRODUCTS -->


<!-- CTA -->
<section class="py-32 text-center fade">
  <h2 class="text-5xl mb-6">Gati për të jetuar më mirë?</h2>
  <a href="produktet .html" class="btn px-12 py-5 rounded-full text-lg">Porosit Tani</a>
</section>



<script>
// scroll animation
const faders=document.querySelectorAll(".fade");
window.addEventListener("scroll",()=>{
  faders.forEach(el=>{
    if(el.getBoundingClientRect().top<window.innerHeight-100){
      el.classList.add("show");
    }
  });
});
</script>

</body>
</html>
